[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcwe"
version = "0.3.0"
description = "Resonant Causal World Engine v0.3.0: Multi-Seed Statistical CIs & Apple Silicon MPS Acceleration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
gpu = ["triton>=2.1.0"]
dev = ["pytest>=7.4.0"]

[project.scripts]
rcwe-bench = "rcwe.cli:main"

[tool.setuptools.packages.find]
include = ["rcwe*"]
